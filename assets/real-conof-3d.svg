<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="real_conof — animated 3D identity">
<title>real_conof — 3D rotating identity</title>
<defs>
 <radialGradient id="space"><stop stop-color="#18203d"/><stop offset=".55" stop-color="#0b1124"/><stop offset="1" stop-color="#060911"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="0.2" y2="1"><stop stop-color="#ffffff"/><stop offset=".25" stop-color="#b8f5ff"/><stop offset=".52" stop-color="#48dfff"/><stop offset=".75" stop-color="#4d75ff"/><stop offset="1" stop-color="#b1a0ff"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43ebff"/><stop offset="1" stop-color="#a479ff"/></linearGradient>
 <linearGradient id="rail"><stop stop-color="#00eaff" stop-opacity="0"/><stop offset=".5" stop-color="#4feaff" stop-opacity=".8"/><stop offset="1" stop-color="#a674ff" stop-opacity="0"/></linearGradient>
 <pattern id="mesh" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8aa4f5" stroke-opacity=".10" stroke-width=".8"/></pattern>
 <filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
 .label{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:4px;fill:#8eacc8}
 .micro{font:500 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.5px;fill:#5f809f}
 .name{font:900 82px 'Arial Black',Inter,Arial,sans-serif;letter-spacing:-3px;text-anchor:middle;paint-order:stroke fill}
 #spin{transform-box:fill-box;transform-origin:center;animation:rotateX 7s cubic-bezier(.45,.05,.55,.95) infinite}
 @keyframes rotateX{
  0%,9%{transform:perspective(680px) rotateX(0deg)}
  22%{transform:perspective(680px) rotateX(77deg)}
  28%{transform:perspective(680px) rotateX(105deg)}
  45%,55%{transform:perspective(680px) rotateX(180deg)}
  72%{transform:perspective(680px) rotateX(255deg)}
  78%{transform:perspective(680px) rotateX(283deg)}
  91%,100%{transform:perspective(680px) rotateX(360deg)}
 }
 #ring{transform-origin:500px 164px;animation:ring 15s linear infinite}
 @keyframes ring{to{transform:rotate(360deg)}}
 #beam{animation:pulse 3.5s ease-in-out infinite}
 @keyframes pulse{50%{opacity:.35}}
 #spark{animation:blink 2s ease-in-out infinite alternate}
 @keyframes blink{to{opacity:.25}}
 @media (prefers-reduced-motion:reduce){#spin,#ring,#beam,#spark{animation:none}}
</style>
<rect width="1000" height="350" rx="19" fill="url(#space)"/>
<rect x="1" y="1" width="998" height="348" rx="18" fill="none" stroke="#5279b2" stroke-opacity=".35"/>
<rect x="12" y="12" width="976" height="326" rx="14" fill="url(#mesh)"/>
<path d="M25 73V28H70 M930 28H975V73 M25 277V322H70 M930 322H975V277" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".8"/>
<ellipse cx="500" cy="165" rx="345" ry="87" fill="none" stroke="#46cbff" stroke-opacity=".13" stroke-width="1.3"/>
<g id="ring" fill="none" stroke-dasharray="4 16" stroke-width="1.4"><ellipse cx="500" cy="164" rx="397" ry="120" stroke="#58dfff" stroke-opacity=".23"/><ellipse cx="500" cy="164" rx="365" ry="105" stroke="#aa7cff" stroke-opacity=".17"/></g>
<path id="beam" d="M145 176H855" stroke="url(#rail)" stroke-width="2" opacity=".65"/>
<text x="52" y="60" class="label">CONOF / DIGITAL IDENTITY</text>
<text x="948" y="60" class="micro" text-anchor="end">BUILD • BREAK • CREATE</text>
<g id="spin">
 <text x="500" y="197" class="name" fill="#141b52" stroke="#121f58" stroke-width="11" transform="translate(0 11)">real_conof</text>
 <text x="500" y="197" class="name" fill="#223d80" stroke="#244b8e" stroke-width="8" transform="translate(0 8)">real_conof</text>
 <text x="500" y="197" class="name" fill="#3f69ae" stroke="#2567a3" stroke-width="5" transform="translate(0 5)">real_conof</text>
 <text x="500" y="197" class="name" fill="#43d9ff" opacity=".48" filter="url(#glow)">real_conof</text>
 <text x="500" y="197" class="name" fill="url(#metal)" stroke="#b8eeff" stroke-width=".8">real_conof</text>
 <path d="M232 211H768" stroke="url(#rail)" stroke-width="1.5" opacity=".8"/>
</g>
<g id="spark"><circle cx="168" cy="143" r="2" fill="#46e3ff"/><circle cx="832" cy="203" r="2" fill="#a781ff"/><circle cx="698" cy="101" r="1.8" fill="#e1f6ff"/></g>
<text x="500" y="278" class="label" text-anchor="middle">C++  /  REVERSE ENGINEERING  /  DDNET  /  LINUX</text>
<path d="M267 292H733" stroke="url(#rail)" stroke-width="1" opacity=".55"/>
<text x="50" y="322" class="micro">GITHUB.COM/CONOF</text>
<text x="950" y="322" class="micro" text-anchor="end">EST. ∞  ·  OPEN SOURCE MINDSET</text>
</svg>
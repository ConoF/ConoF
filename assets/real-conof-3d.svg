<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="real_conof — rotating terminal banner">
<title>real_conof</title>
<defs>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#13ddea"/><stop offset=".52" stop-color="#527ffc"/><stop offset="1" stop-color="#c476e9"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8af8f9"/><stop offset=".38" stop-color="#42c6ed"/><stop offset=".72" stop-color="#739df8"/><stop offset="1" stop-color="#cf90ef"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#276a96"/><stop offset="1" stop-color="#141d45"/></linearGradient>
 <radialGradient id="bg"><stop stop-color="#111a27"/><stop offset="1" stop-color="#070b11"/></radialGradient>
 <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style>
 .word{font-family:'JetBrains Mono','Cascadia Code','DejaVu Sans Mono',monospace;font-weight:800;font-size:79px;letter-spacing:-3.4px;text-anchor:middle}
 #flip{transform-box:fill-box;transform-origin:center;animation:flipUp 6s linear infinite}
 @keyframes flipUp{
  0%,10%{transform:perspective(850px) rotateX(0deg)}
  25%{transform:perspective(850px) rotateX(-90deg)}
  40%,60%{transform:perspective(850px) rotateX(-180deg)}
  75%{transform:perspective(850px) rotateX(-270deg)}
  90%,100%{transform:perspective(850px) rotateX(-360deg)}
 }
 #cursor{animation:blink 1.15s steps(1) infinite}
 @keyframes blink{50%{opacity:0}}
 @media (prefers-reduced-motion:reduce){#flip,#cursor{animation:none}}
</style>
<rect width="1000" height="300" rx="17" fill="url(#bg)"/>
<rect x="1" y="1" width="998" height="298" rx="16" fill="none" stroke="#253545" stroke-width="2"/>
<path d="M18 1H982" stroke="url(#rim)" stroke-opacity=".78" stroke-width="2"/>
<path d="M18 41H982" stroke="#283846" stroke-width="1"/>
<circle cx="29" cy="21" r="5" fill="#fb6782" fill-opacity=".8"/>
<circle cx="47" cy="21" r="5" fill="#f0c46f" fill-opacity=".8"/>
<circle cx="65" cy="21" r="5" fill="#65caa0" fill-opacity=".8"/>
<path d="M35 83l11 9-11 9" fill="none" stroke="#61e7e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
<path id="cursor" d="M53 103h13" stroke="#61e7e9" stroke-width="3"/>
<ellipse cx="500" cy="158" rx="320" ry="56" fill="#288bc2" opacity=".07" filter="url(#blur)"/>
<g id="flip">
 <text class="word" x="500" y="182" fill="#0a1127" stroke="#172f57" stroke-width="8" transform="translate(0 9)">real_conof</text>
 <text class="word" x="500" y="182" fill="url(#side)" stroke="#1e507a" stroke-width="5" transform="translate(0 6)">real_conof</text>
 <text class="word" x="500" y="182" fill="#37bced" opacity=".32" filter="url(#blur)">real_conof</text>
 <text class="word" x="500" y="182" fill="url(#face)" stroke="#9ed8ed" stroke-opacity=".5" stroke-width=".7">real_conof</text>
</g>
<path d="M310 240H690" stroke="url(#rim)" stroke-opacity=".28" stroke-width="1"/>
</svg>